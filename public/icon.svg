<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas with Safe Margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Flask / Chemical Production Symbol inside safe zone -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Flask Outline -->
    <path d="M -36 -120 L 36 -120 L 36 -60 L 100 80 C 114 110 92 144 56 144 L -56 144 C -92 144 -114 110 -100 80 L -36 -60 Z" 
          fill="none" stroke="#f8fafc" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Flask Neck Lip -->
    <line x1="-48" y1="-120" x2="48" y2="-120" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" />
    
    <!-- Liquid inside -->
    <path d="M -70 50 Q 0 35 70 50 L 85 85 C 92 102 80 126 56 126 L -56 126 C -80 126 -92 102 -85 85 Z" 
          fill="url(#flaskLiquid)" />
    
    <!-- Bubbles -->
    <circle cx="-20" cy="75" r="8" fill="#ecfdf5" opacity="0.9" />
    <circle cx="25" cy="85" r="6" fill="#ecfdf5" opacity="0.8" />
    <circle cx="5" cy="55" r="5" fill="#ecfdf5" opacity="0.7" />
  </g>

  <!-- Factory / Quality Check Badge Accent -->
  <g transform="translate(360, 360)">
    <circle cx="0" cy="0" r="48" fill="url(#accentGrad)" stroke="#0f172a" stroke-width="8" />
    <path d="M -18 2 L -6 14 L 18 -10" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- App Label in safe area -->
  <text x="256" y="445" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4">ÜRETİM &amp; LOT</text>
</svg>

# Ubuntu Nginx Reverse Proxy Ayarı (IP: 62.171.177.210)
# Bu dosyayı /etc/nginx/sites-available/uretim-app olarak kaydedebilirsiniz.

# HTTP -> HTTPS Yönlendirmesi (Opsiyonel)
server {
    listen 80;
    listen [::]:80;
    server_name 62.171.177.210;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# SSL / HTTPS Ayarı (Self-Signed veya Let's Encrypt / Cloudflare Sertifikanız ile)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 62.171.177.210;

    # Kendi SSL sertifika yollarınız:
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
